name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Runs on a maintainer's Mac while their localci up runs; everyone else, fork PRs included, gets ubuntu-latest.
    runs-on: ${{ fromJSON(vars.LOCALCI_RUNNERS || '{}')[github.actor] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; } # not in the LocalCI VM
      - run: shellcheck scripts/*.sh
